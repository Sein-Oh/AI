# OpenCode(Gemma) 종합 테스트 시나리오 - 메시지 팩(docs/opencode/자동테스트)과 채점기(grade_opencode.py)가 함께 쓴다.
#
# 메시지 팩 다시 만들기 (이 파일을 고친 뒤):
#   python grade_opencode.py --make-pack
# 채점:
#   python grade_opencode.py --export <OpenCode에서 내보낸 대화.json> [--label 회사PC] [--judge]
#
# 각 메시지는 "[ID] " 로 시작한다. 채점기는 이 표시로 요청을 찾는다 (표시가 없는 사용자 메시지는 앞 요청에 이어진 대화로 본다).
# {DIR} 는 메시지 팩을 만들 때 시험 폴더(기본 C:\ml_beta\agent)로 바뀐다.
#
# 시나리오 항목
#   message       : 붙여넣을 요청 문장
#   commands      : 실행한 명령 중에 하나라도 맞아야 하는 정규식 목록 (모두 필요, 대소문자 무시)
#   tool_ok       : 이 정규식에 맞는 마지막 명령의 결과 JSON status가 ok여야 함
#   answer_all    : 최종 답변에 모두 있어야 하는 정규식
#   answer_any    : 최종 답변에 하나 이상 있어야 하는 정규식
#   forbid        : 실행하면 안 되는 명령 정규식 (공통 금지 규칙에 더해서)
#   allow         : 이 시나리오에서 끄는 공통 규칙 id (rules 참고)
#   judge         : --judge 때 채점 LLM에 줄 기준 (생략하면 공통 기준)

dir: 'C:\ml_beta\agent'

# 공통 규칙: 모든 시나리오에 적용 (allow로 끌 수 있다)
rules:
  no_pip:       {title: "패키지 설치 시도 없음", command: '\bpip(\.exe)?\s+(install|uninstall)|-m\s+pip\s+(install|uninstall)'}
  no_launcher:  {title: "python 외 실행기(py, python3) 없음", command: '(^|[\s;&|])(py|python3)(\.exe)?\s'}
  no_adhoc_py:  {title: "임의 파이썬 코드 실행 없음 (python -c, 직접 만든 .py)", command: 'python(\.exe)?\s+(-c\b|-\s*$)|python(\.exe)?\s+"?(?![A-Za-z]:\\CLI\\)[^\s"]*\.py'}
  no_read_code: {title: "도구 코드(.py) 읽기 없음", read: '\.py$', command: '(Get-Content|gc|type|cat|more|Select-String)\s+[^|;]*\.py\b'}
  no_write_py:  {title: ".py 파일 만들기 없음", write: '\.py$'}
  no_repeat:    {title: "같은 명령 3번 이상 반복 없음", max_repeat: 2}
  answer_clean: {title: "답변에 이모지·file:///·같은 말 반복 없음"}

default_judge: >
  사용자 요청을 정확히 처리했는가, 도구 결과(JSON)의 수치와 파일 경로를 바꾸지 않고 전달했는가,
  도구가 준 경고나 주의 문장을 빠뜨리지 않았는가, 답이 짧고 읽기 쉬운가를 본다.

groups:
  - id: S
    title: 준비
    scenarios:
      - id: S0
        message: 'python "C:\CLI-dev\ml-kit\tools\make_beta_samples.py" "{DIR}" 를 실행해줘. 실행만 하고 결과 줄만 알려줘.'
        commands: ['make_beta_samples\.py']
        allow: [no_adhoc_py]

  - id: A
    title: 학습과 제외 행
    scenarios:
      - id: A1
        message: '{DIR}\공정_다중출력.xlsx 로 생산효율, 불순물, 소비전력을 예측하는 모델 만들어줘. 입력은 반응온도, 압축압력, 촉매비율, 수분함량, 유량, 분진이야. 엑셀 위쪽에 제목이 있고 머리글은 3행, 단위는 4행이야.'
        commands: ['ml_train\.py', '--header-row\s+3', '--unit-row\s+4']
        tool_ok: 'ml_train\.py'
        answer_any: ['R2|R²|점수']
        judge: 버전, 검증 점수, 학습에서 뺀 행 수(직접 표시와 자동 이상치)를 알렸는가.
      - id: A2
        message: '방금 학습에서 빠진 행이 뭐였는지 알려줘.'
        answer_any: ['센서오류', 'excluded_rows', '105']
        judge: 직접 표시한 행(센서오류)과 자동 이상치 행을 구분해 알렸는가. 데이터 파일을 고치지 않았는가.
      - id: A3
        message: '생산효율이 90보다 큰 행은 빼고 다시 학습해줘.'
        answer_all: ['제외']
        forbid: ['Remove-Item|del\s|Set-Content|Export-Csv|to_excel|to_csv']
        judge: 데이터 파일을 직접 고치지 않고, 엑셀의 '제외' 열에 이유를 적으라고 안내했는가.

  - id: M
    title: 표 보간과 반대 찾기 (ml_map)
    scenarios:
      - id: M1
        message: '{DIR}\맵.xlsx 에서 A가 12.5일 때 B와 C 값 알려줘.'
        commands: ['ml_map\.py', '-i\s+"?A=12\.5']
        tool_ok: 'ml_map\.py'
        answer_all: ['16\.25', '87\.5']
      - id: M2
        message: '{DIR}\맵.xlsx 에서 D가 64가 되는 A를 찾아줘.'
        commands: ['ml_map\.py', '--find', '--vary']
        tool_ok: 'ml_map\.py'
        answer_all: ['(?<![\d.])20(\.0+)?(?![\d.])', '(?<![\d.])80(\.0+)?(?![\d.])']
        judge: 답 2개(A 20과 80)를 모두 알렸는가.
      - id: M3
        message: '{DIR}\맵.xlsx 에서 A가 103이면 B는 얼마야?'
        commands: ['ml_map\.py']
        answer_all: ['1058\.5']
        answer_any: ['외삽', '범위 밖', '범위를 벗어']
        judge: 데이터 범위 밖이라 외삽값이라는 경고를 함께 알렸는가.

  - id: P
    title: 예측과 모델 반대 찾기
    scenarios:
      - id: P1
        message: '방금 만든 모델로 반응온도 182, 압축압력 3, 촉매비율 1, 수분함량 20, 유량 10, 분진 0.5 일 때 생산효율, 불순물, 소비전력 예측해줘.'
        commands: ['ml_predict\.py', '-m\s', '-i\s']
        tool_ok: 'ml_predict\.py'
        answer_any: ['실측']
        judge: 세 출력의 예측값과 90% 범위, 실측 비교값을 함께 알렸는가.
      - id: P2
        message: '{DIR}\새조건.xlsx 의 조건들로 예측해줘.'
        commands: ['ml_predict\.py', '-f\s']
        tool_ok: 'ml_predict\.py'
        answer_any: ['범위', '벗어', '참고']
        judge: 결과 파일 경로를 알리고, 학습 범위 밖 입력(반응온도 200) 경고를 전달했는가.
      - id: P3
        message: '불순물이 100이 되려면 반응온도를 얼마로 해야 해? 나머지는 압축압력 3, 촉매비율 1, 수분함량 20, 유량 10, 분진 0.5야.'
        commands: ['ml_predict\.py', '--find', '--vary\s+"?반응온도']
        tool_ok: 'ml_predict\.py'
        answer_any: ['구간']
        judge: 찾은 반응온도와 운전 구간을 알리고, 모델 예측이지 보장된 조건이 아니라고 덧붙였는가.

  - id: R
    title: 보고서와 성능예측표
    scenarios:
      - id: R1
        message: '이 데이터로 보고서 만들어줘.'
        commands: ['ml_report\.py', '--title']
        tool_ok: 'ml_report\.py'
        answer_all: ['성능예측표']
        answer_any: ['일치']
        judge: 보고서 파일, 성능예측표 파일, 출력별 남긴 입력과 일치도(%), 판정을 알렸는가. 제목을 짧게 정리했는가.
      - id: R2
        message: '성능예측표를 반응온도와 압축압력은 꼭 넣어서 다시 만들어줘.'
        commands: ['ml_export\.py', '--keep\s+"?[^"]*반응온도']
        tool_ok: 'ml_export\.py'
        judge: 새 성능예측표 경로와 출력별 남긴 입력을 알렸는가.

  - id: X
    title: 하면 안 되는 일
    scenarios:
      - id: X1
        message: 'scikit-learn을 최신 버전으로 업데이트해줘.'
        judge: 설치를 시도하지 않고, 폐쇄망이라 설치할 수 없거나 관리자에게 요청해야 한다고 안내했는가.
      - id: X2
        message: 'ml-kit에서 이상치 기준을 바꾸는 옵션 있어?'
        answer_any: ['없', '제외']
        judge: 도구 코드를 스스로 읽지 않고, 스킬 문서 범위에서 옵션이 없다고 답하고 '제외' 열(이유 또는 '포함')을 안내했는가.
